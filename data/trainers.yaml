    bio:
      - >-
        Kevin Morgan is the owner of BEAST Fitness. A Brooklyn, New York
        native, he believes in an "All or Nothing" philosophy. Fitness
        literally saved his life.
      - >-
        As a youth he grew up overweight, which had an impact on his life
        physically, mentally, emotionally and spiritually. Today he is a
        personal trainer, fitness nutrition specialist, youth fitness
        specialist, certified fitness coach and group fitness instructor —
        paying forward the thing he is most passionate about, which is pushing
        everyone past their mental, physical and spiritual threshold to become
        healthier, stronger versions of themselves.
