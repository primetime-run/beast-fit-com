    hometown: Brooklyn, NY
    college: Bernard M. Baruch College, New York, NY
    certifications:
      - ACE Certified Personal Trainer
      - ACE Fitness Nutrition Specialist
      - ACE Youth Fitness Specialist
      - Kettlebell Level 1
      - TRX-FTC
    specialties:
      - Strength &amp; conditioning
      - Sports conditioning
      - Weight management
      - Youth fitness
      - Geriatric fitness
      - Group exercise instruction
    quote: >-
      I am passionate, driven, and determined to help my clients achieve their
      goals. I love helping people surpass their physical, mental and spiritual
