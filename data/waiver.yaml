# ---------------------------------------------------------------------------
# The waiver text.
#
# NOT DRAFTED BY A LAWYER. This is plain-English wording written to be clear
# and complete rather than to be enforceable, and its enforceability has not
# been assessed. It is in use pending review.
#
# Points to put in front of whoever reviews it:
#
#   - Florida requires release language to be clear and unambiguous, and
#     courts read it strictly against the party relying on it.
#   - MINORS. Kirton v. Fields, 997 So. 2d 349 (Fla. 2008) held that a parent
#     cannot bind a minor to a pre-injury release for a commercial activity.
#     This gym trains under-18s, so the guardian section needs specific
#     attention rather than boilerplate.
#   - Outdoor, unshaded, year-round in Florida: heat illness, lightning,
#     uneven ground and insects are foreseeable and worth naming.
#   - Whether medical conditions should be collected at all. Asking creates a
#     duty to act on the answer, and stores health data.
#
# STRUCTURE
#
# One source, two outputs: /waiver/ renders this, and the PDF is generated
# from the same file, so the page and the signed document cannot drift apart.
# `version` is stamped into every PDF — if the text changes, you can still
# tell which wording someone actually agreed to.
# ---------------------------------------------------------------------------

version: "2026-08"

title: Release and Waiver of Liability
intro: >-
  Read this before taking part. It affects your legal rights. Ask us if
  anything is unclear.

sections:
  - heading: What the activity involves
    body: >-
      BEAST Fitness runs group fitness classes and personal training outdoors,
      on a field, year round and in whatever weather the day brings. Sessions
      involve strenuous physical exertion, which may include running, jumping,
      lifting weights and body-weight exercise on uneven natural ground.

  - heading: Risks you are accepting
    body: >-
      Physical activity of this kind carries risk of injury, up to and
      including serious injury, permanent disability and death. Training
      outdoors in Florida adds heat exhaustion and heat stroke, dehydration,
      sun exposure, lightning, insect bites and stings, and uneven or slippery
      ground. This list is not exhaustive.

  - heading: Your condition
    body: >-
      You confirm you are physically able to take part, that you have no
      condition that makes this activity unsafe for you, and that you have
      been advised to consult a doctor before starting any exercise programme.
      You will stop and tell a trainer if you feel unwell.

  - heading: Release
    body: >-
      In exchange for being allowed to take part, you agree to accept these
      risks and to release BEAST Fitness LLC, its owners, trainers, employees
      and agents from any claim for injury, illness, loss or damage arising
      from your participation, other than where it is caused by their
      recklessness or intentional wrongdoing. This applies to you and to
      anyone claiming on your behalf. If any part of this release is held to
      be unenforceable, the rest of it continues to apply.

  - heading: Media
    body: >-
      Sessions are sometimes photographed or filmed for social media. Tell us
      if you would rather not appear, and we will keep you out of it.

# Ticked individually. Separate boxes rather than one blanket agreement, so
# there is a record of what each person specifically acknowledged.
acknowledgements:
  - I have read and understood this waiver in full.
  - I understand the risks of outdoor exercise, including heat and uneven ground.
  - I confirm I am physically fit to take part.
  - I am signing this freely and without inducement.
