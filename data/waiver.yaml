# ---------------------------------------------------------------------------
# The waiver.
#
# Attorney-drafted and reproduced VERBATIM. Do not reword, condense or reorder
# any of it. `version` is the law firm's own document reference, which is what
# ties a signature back to the exact draft that was signed.
#
# The document carries an integration clause — it "contains the entire
# understanding" — so nothing else on the page may read as a term of it. An
# earlier draft here had descriptive sections about outdoor risk, heat and
# uneven ground; those were removed rather than left alongside, because
# anything presented as part of the agreement can be argued to be part of the
# agreement.
#
# {{name}} is replaced with the participant's name, both on the page as it is
# typed and in the PDF as it is signed. It stands in for the blank line in the
# original.
#
# STRUCTURE
#
# One source, two outputs: /waiver/ renders this and the PDF is generated from
# the same file, so the page someone read and the document they signed cannot
# drift apart. Every PDF carries this version plus a hash of the text.
#
# NOTE FOR WHOEVER MAINTAINS THIS
#   - The corporate name here is "B.E.A.S.T. Fitness, Inc., a Florida
#     corporation". The brand is not an acronym and is written BEAST
#     everywhere else, and the privacy policy says "Beast Fitness LLC" —
#     three spellings and two entity types across one site.
#
#     Left exactly as the attorney wrote it, deliberately. If the company is
#     registered with the Florida Division of Corporations as "B.E.A.S.T.
#     Fitness, Inc." then that is the name the release has to use, however the
#     brand is styled; a release naming an entity that does not exist protects
#     nobody. Check the registered name and have the attorney correct the
#     document if it is wrong. Do not edit it here.
#   - The agreement assumes the client resides in Florida.
#   - Minors: this text has no guardian provision. The form collects one and
#     the PDF records it, but whether a parent can bind a minor here is a
#     question for the attorney — see Kirton v. Fields, 997 So. 2d 349
#     (Fla. 2008).
# ---------------------------------------------------------------------------

version: "FTL:2274504:1"

title: >-
  Release, Indemnification and Hold Harmless Agreement and Agreement for Use
  of Name, Image and/or Likeness

intro: >-
  Read this before taking part. It affects your legal rights. Ask us if
  anything is unclear.

paragraphs:
  - >-
    FOR GOOD AND VALUABLE CONSIDERATION, the receipt and sufficiency of which
    are hereby acknowledged, {{name}}, an individual residing in the State of
    Florida (“CLIENT”), on his/her own behalf and on behalf of his/her
    respective heirs, representatives, executors, administrators and/or agents,
    shall hereinafter release, indemnify, defend, protect and otherwise hold
    harmless B.E.A.S.T. Fitness, Inc., a Florida corporation (“BEAST”), and its
    respective officers, members, managers, representatives, executors,
    administrators, agents, attorneys, successors and/or assigns, from any and
    all past, present, and future actions, causes and causes of action, claims,
    controversies, damages, judgments, executions, agreements, contractors,
    promises, or suits of any kind or make whatsoever, in law or in equity, as
    they now have, ever had, will ever have, from now until the end of time,
    whether known or unknown, including the trial and appellate levels,
    including any and all attorneys’ fees and costs incurred, in connection
    with and/or otherwise related to any and all instruction, teaching,
    technique, demonstration, directive, competition, and/or other activity
    provided by BEAST to CLIENT.

  - >-
    FOR GOOD AND VALUABLE CONSIDERATION, the receipt and sufficiency of which
    are hereby acknowledged, CLIENT on his/her own behalf and on behalf of
    his/her respective heirs, representatives, executors, administrators and/or
    agents, shall hereinafter permit BEAST to use his/her name, image and/or
    likeness for any promotional and/or marketing purposes and/or for any other
    purposes that BEAST shall determine, in its sole and absolute discretion
    and without limitation.

  - >-
    IT IS FURTHER UNDERSTOOD AND AGREED that in making this Release,
    Indemnification and Hold Harmless Agreement and Agreement for Use of Name,
    Image and Likeness, CLIENT relies wholly upon his/her own judgment, belief
    and knowledge of the nature, extent and duration of the facts and
    circumstances in connection with the making hereon, and warrant that it has
    not been influenced to any extent whatsoever in making this by any
    representations or statements regarding said facts, or regarding any other
    matters, made by the company who is hereby released, or by any person or
    persons representing it.

  - >-
    IT IS FURTHER UNDERSTOOD AND AGREED that CLIENT has carefully read this
    Release, Indemnification and Hold Harmless Agreement and Agreement for Use
    of Name, Image and Likeness, know and understand its contents, and sign it
    voluntarily as its own free act and deed and have been the afforded the
    opportunity to seek advice of counsel.

  - >-
    IT IS FURTHER UNDERSTOOD AND AGREED that this Release, Indemnification and
    Hold Harmless Agreement and Agreement for Use of Name, Image and Likeness
    shall be construed, interpreted and governed by Florida law, with venue for
    any action arising out of or related to this Release, Indemnification and
    Hold Harmless Agreement being the jurisdictional court lying situate in
    Palm Beach County, Florida.

  - >-
    IT IS FURTHER UNDERSTOOD AND AGREED that Release, Indemnification and Hold
    Harmless Agreement and Agreement for Use of Name, Image and Likeness
    contains the entire understanding of CLIENT and BEAST. The terms of this
    Release, Indemnification and Hold Harmless Agreement and Agreement for Use
    of Name, Image and Likeness are contractual and not a mere recital.

# Ticked individually, and worded from the document's own paragraphs rather
# than invented — the fourth paragraph is the one that recites having read it,
# understood it, signed voluntarily and had the chance to take advice. Separate
# boxes so there is a record of what was specifically acknowledged.
acknowledgements:
  - I have carefully read this agreement and understand its contents.
