# ---------------------------------------------------------------------------
# The gym's privacy policy, migrated verbatim from the WordPress page.
#
# Converted mechanically from the original HTML — the wording is the owner's
# legal statement and has not been edited. Structure only:
#
#   h2 / h3 / h4   headings
#   p              paragraph
#   ul             list; an item is either a string, or { blocks: [...] } when
#                  it holds more than one paragraph
#
# Inline markup is deliberately limited to two forms, so that no HTML lives in
# this file and nothing here can inject markup into the page:
#
#   **bold**          ->  <strong>
#   [text](https://)  ->  <a href="https://">
#
# NOTE: this text still describes cookies, Google Analytics and a mobile
# application. The site has none of those. The page says so in a notice above
# the policy. Correcting the policy itself is the owner's call, not ours.
# ---------------------------------------------------------------------------

blocks:
  - p: "Effective date: August 23, 2018"
  - p: Beast Fitness LLC S-corp ("us", "we", or "our") operates the https://beast-fit.com website and the Beast Fitness mobile application (the "Service").
  - p: This page informs you of our policies regarding the collection, use, and disclosure of personal data when you use our Service and the choices you have associated with that data.
  - p: We use your data to provide and improve the Service. By using the Service, you agree to the collection and use of information in accordance with this policy. Unless otherwise defined in this Privacy Policy, terms used in this Privacy Policy have the same meanings as in our Terms and Conditions.
  - h2: Information Collection And Use
  - p: We collect several different types of information for various purposes to provide and improve our Service to you.
  - h3: Types of Data Collected
  - h4: Personal Data
  - p: 'While using our Service, we may ask you to provide us with certain personally identifiable information that can be used to contact or identify you ("Personal Data"). Personally identifiable information may include, but is not limited to:'
  - ul:
      - Email address
      - First name and last name
      - Phone number
      - Address, State, Province, ZIP/Postal code, City
      - Cookies and Usage Data
  - h4: Usage Data
  - p: We may also collect information that your browser sends whenever you visit our Service or when you access the Service by or through a mobile device ("Usage Data").
  - p: This Usage Data may include information such as your computer's Internet Protocol address (e.g. IP address), browser type, browser version, the pages of our Service that you visit, the time and date of your visit, the time spent on those pages, unique device identifiers and other diagnostic data.
  - p: When you access the Service by or through a mobile device, this Usage Data may include information such as the type of mobile device you use, your mobile device unique ID, the IP address of your mobile device, your mobile operating system, the type of mobile Internet browser you use, unique device identifiers and other diagnostic data.
  - h4: Tracking & Cookies Data
  - p: We use cookies and similar tracking technologies to track the activity on our Service and hold certain information.
  - p: Cookies are files with small amount of data which may include an anonymous unique identifier. Cookies are sent to your browser from a website and stored on your device. Tracking technologies also used are beacons, tags, and scripts to collect and track information and to improve and analyze our Service.
  - p: You can instruct your browser to refuse all cookies or to indicate when a cookie is being sent. However, if you do not accept cookies, you may not be able to use some portions of our Service.
  - p: "Examples of Cookies we use:"
  - ul:
      - "**Session Cookies.** We use Session Cookies to operate our Service."
      - "**Preference Cookies.** We use Preference Cookies to remember your preferences and various settings."
      - "**Security Cookies.** We use Security Cookies for security purposes."
  - h2: Use of Data
  - p: "Beast Fitness LLC uses the collected data for various purposes:"
  - ul:
      - To provide and maintain the Service
      - To notify you about changes to our Service
      - To allow you to participate in interactive features of our Service when you choose to do so
      - To provide customer care and support
      - To provide analysis or valuable information so that we can improve the Service
      - To monitor the usage of the Service
      - To detect, prevent and address technical issues
  - h2: Transfer Of Data
  - p: Your information, including Personal Data, may be transferred to — and maintained on — computers located outside of your state, province, country or other governmental jurisdiction where the data protection laws may differ than those from your jurisdiction.
  - p: If you are located outside United States and choose to provide information to us, please note that we transfer the data, including Personal Data, to United States and process it there.
  - p: Your consent to this Privacy Policy followed by your submission of such information represents your agreement to that transfer.
  - p: Beast Fitness LLC will take all steps reasonably necessary to ensure that your data is treated securely and in accordance with this Privacy Policy and no transfer of your Personal Data will take place to an organization or a country unless there are adequate controls in place including the security of your data and other personal information.
  - h2: Disclosure Of Data
  - h3: Legal Requirements
  - p: "Beast Fitness LLC may disclose your Personal Data in the good faith belief that such action is necessary to:"
  - ul:
      - To comply with a legal obligation
      - To protect and defend the rights or property of Beast Fitness LLC
      - To prevent or investigate possible wrongdoing in connection with the Service
      - To protect the personal safety of users of the Service or the public
      - To protect against legal liability
  - h2: Security Of Data
  - p: The security of your data is important to us, but remember that no method of transmission over the Internet, or method of electronic storage is 100% secure. While we strive to use commercially acceptable means to protect your Personal Data, we cannot guarantee its absolute security.
  - h2: Service Providers
  - p: We may employ third party companies and individuals to facilitate our Service ("Service Providers"), to provide the Service on our behalf, to perform Service-related services or to assist us in analyzing how our Service is used.
  - p: These third parties have access to your Personal Data only to perform these tasks on our behalf and are obligated not to disclose or use it for any other purpose.
  - h3: Analytics
  - p: We may use third-party Service Providers to monitor and analyze the use of our Service.
  - ul:
      - blocks:
          - p: "**Google Analytics**"
          - p: Google Analytics is a web analytics service offered by Google that tracks and reports website traffic. Google uses the data collected to track and monitor the use of our Service. This data is shared with other Google services. Google may use the collected data to contextualize and personalize the ads of its own advertising network.
          - p: "For more information on the privacy practices of Google, please visit the Google Privacy & Terms web page: [https://policies.google.com/privacy?hl=en](https://policies.google.com/privacy?hl=en)"
  - h2: Links To Other Sites
  - p: Our Service may contain links to other sites that are not operated by us. If you click on a third party link, you will be directed to that third party's site. We strongly advise you to review the Privacy Policy of every site you visit.
  - p: We have no control over and assume no responsibility for the content, privacy policies or practices of any third party sites or services.
  - h2: Children's Privacy
  - p: Our Service does not address anyone under the age of 18 ("Children").
  - p: We do not knowingly collect personally identifiable information from anyone under the age of 18. If you are a parent or guardian and you are aware that your Children has provided us with Personal Data, please contact us. If we become aware that we have collected Personal Data from children without verification of parental consent, we take steps to remove that information from our servers.
  - h2: Changes To This Privacy Policy
  - p: We may update our Privacy Policy from time to time. We will notify you of any changes by posting the new Privacy Policy on this page.
  - p: We will let you know via email and/or a prominent notice on our Service, prior to the change becoming effective and update the "effective date" at the top of this Privacy Policy.
  - p: You are advised to review this Privacy Policy periodically for any changes. Changes to this Privacy Policy are effective when they are posted on this page.
  - h2: Contact Us
  - p: "If you have any questions about this Privacy Policy, please contact us:"
  - ul:
      - "By email: info@beast-fit.com"
      - "By visiting this page on our website: https://beast-fit.com/contact-us/"
      - "By phone number: 347-661-7200"
      - "By mail: 6182 Indian Forest Circle, Lake Worth FL 33463"
